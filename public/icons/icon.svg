<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563eb"/>
      <stop offset="100%" style="stop-color:#1d4ed8"/>
    </linearGradient>
  </defs>
  <!-- Background rounded square -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <!-- PDF document shape -->
  <rect x="128" y="96" width="256" height="320" rx="24" fill="white" opacity="0.15"/>
  <rect x="148" y="116" width="216" height="280" rx="16" fill="white" opacity="0.20"/>
  <!-- "P" letter for PDF -->
  <text x="256" y="340" font-family="system-ui, -apple-system, sans-serif" font-size="280" font-weight="bold" fill="white" text-anchor="middle" dominant-baseline="central">PDF</text>
  <!-- Tool icon (wrench) overlay -->
  <g transform="translate(340, 120)">
    <circle cx="40" cy="40" r="44" fill="white" opacity="0.95"/>
    <path d="M28 18 C22 28, 22 42, 32 52 L50 34 C40 24, 36 18, 28 18Z" fill="#2563eb"/>
    <rect x="46" y="38" width="8" height="20" rx="4" fill="#2563eb" transform="rotate(-45, 50, 48)"/>
  </g>
</svg>
